name: Platform tests

# Windows path handling and the macOS UI are tested out of band: weekly and
# on demand. The free account shares five macOS runners between workflows,
# and these jobs do not need to hold up a pull request or a release.
# Every push is still cross-compiled for both platforms by CI.
on:
  schedule:
    - cron: "0 7 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: app/go.mod
          cache-dependency-path: app/go.sum
          cache: true
      - name: Test
        run: go test ./...
        env:
          CGO_ENABLED: "0"
