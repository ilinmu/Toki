name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# A newer push to a pull request cancels the older run; a push to main never
# cancels, so every commit gets a full run before it can be released.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  # The single required check, always present: a docs-only change still runs
  # and reports success instead of leaving a pending check. One runner pays
  # for the whole job; there is no second job to queue and no gate to wait.
  ci:
    name: CI
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: dorny/paths-filter@v3
        id: filter
        if: github.event_name != 'workflow_dispatch'
        with:
          filters: |
            code:
              - 'app/**'
              - 'bin/**'
              - '.github/workflows/**'
              - '.gitleaksignore'
              - 'Makefile'

      # Every platform-independent check lives here: one Go setup, one set
      # of caches. The other platforms are compiled on every tag by Build
      # and tested weekly by Platform tests.
      - uses: actions/setup-go@v7
        if: github.event_name == 'workflow_dispatch' || steps.filter.outputs.code == 'true'
        with:
          go-version-file: app/go.mod
          cache-dependency-path: app/go.sum
          cache: true
      - name: Check formatting
        if: github.event_name == 'workflow_dispatch' || steps.filter.outputs.code == 'true'
        working-directory: app
        run: test -z "$(gofmt -l .)"
      - name: Vet
        if: github.event_name == 'workflow_dispatch' || steps.filter.outputs.code == 'true'
        working-directory: app
        run: go vet ./...
      - name: Mygo vet
        if: github.event_name == 'workflow_dispatch' || steps.filter.outputs.code == 'true'
        working-directory: app
        run: go tool mygo vet .
      - name: Restore staticcheck
        if: github.event_name == 'workflow_dispatch' || steps.filter.outputs.code == 'true'
        uses: actions/cache@v4
        with:
          path: ~/.local/bin/staticcheck
          key: staticcheck
      - name: Install staticcheck
        if: github.event_name == 'workflow_dispatch' || steps.filter.outputs.code == 'true'
        run: |
          if [ ! -x ~/.local/bin/staticcheck ]; then
            GOBIN="$HOME/.local/bin" go install honnef.co/go/tools/cmd/staticcheck@v0.8.2
          fi
      - name: Staticcheck
        if: github.event_name == 'workflow_dispatch' || steps.filter.outputs.code == 'true'
        working-directory: app
        run: ~/.local/bin/staticcheck ./...
      - name: Test
        if: github.event_name == 'workflow_dispatch' || steps.filter.outputs.code == 'true'
        working-directory: app
        run: go test ./...
        env:
          CGO_ENABLED: "0"

      # Always: a secret must never land in a documentation-only commit.
      - name: Restore gitleaks
        uses: actions/cache@v4
        with:
          path: ~/.local/bin/gitleaks
          key: gitleaks
      - name: Secret scan
        run: |
          if [ ! -x ~/.local/bin/gitleaks ]; then
            mkdir -p ~/.local/bin
            curl -sSL https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz \
              | tar -xz -C ~/.local/bin gitleaks
          fi
          ~/.local/bin/gitleaks detect --source . --redact --verbose
