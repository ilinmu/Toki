name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# A newer push to a pull request cancels the older run; a push to main never
# cancels, so every commit gets a full run before it can be released.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  # One quick job decides whether a change can affect the build. Docs and
  # screenshot changes only need the secret scan.
  changes:
    name: changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      code: ${{ steps.filter.outputs.code }}
    steps:
      - uses: actions/checkout@v7
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            code:
              - 'app/**'
              - 'bin/**'
              - '.github/workflows/**'
              - '.gitleaksignore'
              - 'Makefile'

  # The single required check. It always runs, so a docs-only pull request
  # reports success instead of leaving a pending check. Everything that does
  # not care about the operating system lives here: one Go setup, one set of
  # caches, no gate job waiting on other runners.
  ci:
    name: CI
    needs: changes
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CODE: ${{ needs.changes.outputs.code }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Guard the filter
        if: needs.changes.result != 'success'
        run: exit 1

      - uses: actions/setup-go@v7
        if: env.CODE == 'true'
        with:
          go-version-file: app/go.mod
          cache-dependency-path: app/go.sum
          cache: true
      - name: Check formatting
        if: env.CODE == 'true'
        working-directory: app
        run: test -z "$(gofmt -l .)"
      - name: Vet
        if: env.CODE == 'true'
        working-directory: app
        run: go vet ./...
      - name: Mygo vet
        if: env.CODE == 'true'
        working-directory: app
        run: go tool mygo vet .
      - name: Staticcheck
        if: env.CODE == 'true'
        working-directory: app
        run: go run honnef.co/go/tools/cmd/staticcheck@latest ./...
      - name: Test
        if: env.CODE == 'true'
        working-directory: app
        run: go test ./...
        env:
          CGO_ENABLED: "0"

      # Always: a secret must never land in a documentation-only commit.
      - name: Restore gitleaks
        uses: actions/cache@v4
        with:
          path: ~/.local/bin/gitleaks
          key: gitleaks-8.30.1
      - name: Secret scan
        run: |
          if [ ! -x ~/.local/bin/gitleaks ]; then
            mkdir -p ~/.local/bin
            curl -sSL https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz \
              | tar -xz -C ~/.local/bin gitleaks
          fi
          ~/.local/bin/gitleaks detect --source . --redact --verbose
